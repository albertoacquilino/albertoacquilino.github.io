<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABC Recovery Exercises</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#16202a;background:#f7f8fa}body{margin:0}main{max-width:980px;margin:0 auto;padding:32px 18px 48px}h1{font-size:2rem;margin:0 0 8px}p{line-height:1.5}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}button{background:#1d5f7a;color:white;border:0;border-radius:6px;padding:12px 16px;font-weight:700;cursor:pointer;white-space:nowrap}section{background:white;border:1px solid #d7dde4;border-radius:8px;padding:18px;margin:16px 0}h2{font-size:1.1rem;margin:0 0 10px}pre{white-space:pre-wrap;background:#f1f4f7;border:1px solid #d7dde4;border-radius:6px;padding:14px;overflow:auto}.meta{color:#536271;margin:0 0 14px}.status{color:#536271;font-weight:650}@media(max-width:720px){.top{display:block}button{width:100%;margin-top:12px}}</style></head><body><main><div class="top"><div><h1>ABC Recovery Exercises</h1><p class="meta">Faulty LLM-generated ABC exercises for automatic recovery. Prompts below correspond to groups in downloadable batch.</p><p class="status" id="count"></p></div><button id="download">Download batch1.zip</button></div><div id="prompts"></div></main><script>const DATA={"prompts":[["Runs 1-3","Generate a valid piece of monophonic beginner practice music in ABC notation that respects the following constraints:\n\nIt is in the b flat major scale\nIt includes slurred notes\nIt is 4 bars long\nIt is at 120 BPM\nIt is in 4/4\nMake sure that each bar is distinct from other bars\nMake sure that the ABC notation is valid and can run\nMake sure that each bar's total note duration is 4\nGenerate only the ABC notation and no other text"],["Runs 4-5","Generate a valid piece of monophonic practice music in ABC notation that respects the following constraints:\n\nIt is in the b flat major scale\nIt includes slurred notes\nIt is 4 bars long\nIt is at 120 BPM\nIt is in 4/4\nYou are only allowed to use notes in the range C to c\nThere can only be a maximum of 5 notes per bar\nThere must be at least 3 notes per bar\nThe maximum distance between notes can only be 5 (for example C to G or G to_A)\nMake sure that each bar is distinct from other bars\nMake sure that the ABC notation is valid and can run\nMake sure that each bar's total note duration is 4\nGenerate only the ABC notation and no other text"],["Runs 6-7","Generate a valid piece of monophonic practice music in ABC notation that respects the following constraints:\n\nIt is in the b flat major scale\nIt includes slurred notes\nIt is 4 bars long\nIt is at 120 BPM\nIt is in 4/4\nYou are only allowed to use notes in the range C to c\nThere can only be a maximum of 5 notes per bar\nThere must be at least 3 notes per bar\nThe maximum distance between notes can only be 5 semitones (for example C to G or G to_A)\nMake sure that each bar is distinct from other bars\nMake sure that the ABC notation is valid and can run\nMake sure that each bar's total note duration is 4\nGenerate only the ABC notation and no other text"],["Runs 8-10","Generate a valid piece of monophonic practice music in ABC notation that respects the following constraints:\n\nIt is in the b flat minor scale\nIt includes slurred notes\nIt is 4 bars long\nIt is at 120 BPM\nIt is in 4/4\nYou are only allowed to use notes in the range C to c\nThere can only be a maximum of 5 notes per bar\nThere must be at least 3 notes per bar\nThe maximum distance between notes can only be 5 semitones (for example C to G or G to _A)\nMake sure that each bar is distinct from other bars\nMake sure that the ABC notation is valid and can run\nMake sure that each bar's total note duration is 4\nGenerate only the ABC notation and no other text"],["Runs 11-14","Generate a valid piece of monophonic practice music in ABC notation that respects the following constraints:\n\nIt is in the b flat pentatonic scale\nIt includes slurred notes\nIt is 4 bars long\nIt is at 120 BPM\nIt is in 4/4\nYou are only allowed to use notes in the range C to c\nThere can only be a maximum of 5 notes per bar\nThere must be at least 3 notes per bar\nThe maximum distance between notes can only be 5 semitones (for example C to G or G to _A)\nMake sure that each bar is distinct from other bars\nMake sure that the ABC notation is valid and can run\nMake sure that each bar's total note duration is 4\nGenerate only the ABC notation and no other text"]],"files":[]};
const enc=new TextEncoder();function crc32(bytes){let c=-1;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^(0xedb88320&-(c&1));}return(c^(-1))>>>0}function u16(n){return[n&255,n>>>8&255]}function u32(n){return[n&255,n>>>8&255,n>>>16&255,n>>>24&255]}function makeZip(files){let parts=[],central=[],offset=0;for(const f of files){let name=enc.encode(f.name),body=enc.encode(f.text),crc=crc32(body);let local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(body.length),...u32(body.length),...u16(name.length),...u16(0),...name]);parts.push(local,body);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(body.length),...u32(body.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]));offset+=local.length+body.length}let csize=central.reduce((n,p)=>n+p.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(offset),...u16(0)]);return new Blob([...parts,...central,end],{type:'application/zip'})}document.getElementById('count').textContent=`${DATA.files.length} ABC files in 14 runs.`;document.getElementById('prompts').innerHTML=DATA.prompts.map(([r,p])=>`<section><h2>${r}</h2><pre>${p.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</pre></section>`).join('');document.getElementById('download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(makeZip(DATA.files));a.download='batch1.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></body></html>
